name: Retry Step
description: Retry a repeat-safe bash command on failure

inputs:
  command:
    description: The bash command to run
    required: true
  max_attempts:
    description: Maximum number of attempts
    required: false
    default: '3'
  delay:
    description: Seconds to wait between attempts
    required: false
    default: '10'

runs:
  using: composite
  steps:
    - name: Run Command With Retries
      shell: bash
      env:
        RETRY_COMMAND: ${{ inputs.command }}
        RETRY_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        RETRY_DELAY: ${{ inputs.delay }}
      run: |
        set -u
        attempt=0
        while true; do
          attempt=$((attempt + 1))
          printf '::notice title=Retry Step::Attempt %d of %s\n' "$attempt" "$RETRY_MAX_ATTEMPTS"
          if bash -euo pipefail -c "$RETRY_COMMAND"; then
            exit 0
          fi
          if [ "$attempt" -ge "$RETRY_MAX_ATTEMPTS" ]; then
            printf '::error title=Retry Step::Command failed after %d attempts\n' "$RETRY_MAX_ATTEMPTS"
            exit 1
          fi
          printf '::warning title=Retry Step::Command failed, retrying in %ss...\n' "$RETRY_DELAY"
          sleep "$RETRY_DELAY"
        done
