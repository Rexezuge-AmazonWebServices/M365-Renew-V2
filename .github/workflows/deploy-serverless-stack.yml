name: Deploy Serverless Stack

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Dump DOT_ENV to Repository
        run: |
          if [ ! -f ".env" ]; then
            echo "${DOT_ENV}" > .env
          fi
        env:
          DOT_ENV: ${{ vars.DOT_ENV }}

      - name: Install Dependencies
        run: npm install

      - name: Deploy Stack to AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
        run: npm run deploy

  cleanup-deployment-bucket:
    name: Cleanup Deployment Bucket
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Purge all object versions from deployment S3 bucket
        env:
          DEPLOYMENT_S3_BUCKET: ${{ vars.DEPLOYMENT_S3_BUCKET }}
        run: |
          set -euo pipefail

          bucket="${DEPLOYMENT_S3_BUCKET:?DEPLOYMENT_S3_BUCKET is not set}"
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT

          while true; do
            objects="$(aws s3api list-object-versions \
              --bucket "$bucket" \
              --max-keys 1000 \
              --no-paginate \
              --output json \
              | jq -c '[(.Versions // [])[], (.DeleteMarkers // [])[]] | .[:1000] | map({Key: .Key, VersionId: .VersionId})')"

            count="$(jq 'length' <<< "$objects")"
            if [ "$count" -eq 0 ]; then
              echo "Deployment bucket s3://$bucket is empty."
              break
            fi

            echo "Deleting $count object version(s)/delete marker(s)..."
            jq -c '{Objects: ., Quiet: true}' <<< "$objects" > "$payload"

            result="$(aws s3api delete-objects \
              --bucket "$bucket" \
              --delete "file://$payload")"

            errors="$(jq '(.Errors // []) | length' <<< "$result")"
            if [ "$errors" -gt 0 ]; then
              jq '.Errors' <<< "$result" >&2
              exit 1
            fi
          done
